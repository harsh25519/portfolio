/* tools: stars scattered across a sky; pick a category to light its constellation */
(function(){
  const sky=$('sky'),svg=$('lines'),all=DATA.skills.flatMap(g=>g[1].map(n=>({n,c:g[0]})));
  let sel=null,pos=[],els=[],selIdx=[],lnEls=[];
  const IDLE='Select a category, or any star, to light up its constellation.';
  /* star size follows relevance to my backend focus (0..1), kept in a narrow range so neighbours never look too different */
  const WT={'Java':1,'Spring Boot':1,'Microservices':1,'REST':.95,'Docker':.9,'PostgreSQL':.85,'Redis':.8,'Spring MVC':.8,'Kubernetes':.8,'Hibernate':.75,'AWS':.75,'GitHub Actions':.75,'Kafka':.7,'OAuth2':.7,'CI/CD':.7,'JPA':.65,'JWT':.65,'Rate limiting':.6,'Linux':.55,'SQL':.5,'WebSockets':.5,'RBAC':.45,'MongoDB':.45,'Python':.4,'JUnit 5':.4,'Postman':.35,'LangChain':.3,'JaCoCo':.25,'SonarCloud':.25,'RAG':.15,'Vector databases':.1,'Prompt engineering':.1};
  const SZ=all.map(t=>Math.round(36+(WT[t.n]!==undefined?WT[t.n]:.3)*16));
  $('legend').innerHTML=DATA.skills.map(g=>`<button data-c="${g[0]}" aria-pressed="false">${g[0]}</button>`).join('');
  els=all.map((t,i)=>{const b=document.createElement('button'),w=t.n.split(/[\s.\/-]+/),m=w.length>1?w[0][0]+w[1][0]:t.n.slice(0,2);
    b.className='star';b.dataset.c=t.c;b.style.setProperty('--d',(i%7)*.45+'s');b.style.setProperty('--sz',SZ[i]+'px');b.setAttribute('aria-label',t.n+', '+t.c);
    b.innerHTML=`<i${ICONS[t.n]?' class="lg"':''}>${ICONS[t.n]?`<img src="${ICONS[t.n]}" alt="">`:m}</i><span>${t.n}</span>`;sky.appendChild(b);return b});
  function layout(){
    const W=sky.clientWidth,H=sky.clientHeight;let a=42;
    const rng=()=>(a=(a*16807)%2147483647)/2147483647,placed=[];pos=[];
    /* biggest first; each star takes the candidate spot that leaves the most room to its neighbours, so big ones spread out */
    all.map((t,i)=>i).sort((x,y)=>SZ[y]-SZ[x]).forEach(i=>{let best=null,bs=-1e9;
      for(let k=0;k<70;k++){const x=62+rng()*(W-124),y=34+rng()*(H-92);let m=1e9;
        placed.forEach(j=>{m=Math.min(m,Math.hypot(pos[j][0]-x,pos[j][1]-y)-(SZ[i]+SZ[j])/2)});
        if(m>bs){bs=m;best=[x,y]}}
      pos[i]=best;placed.push(i)});
  }
  function update(){
    const W=sky.clientWidth,H=sky.clientHeight;
    sky.classList.toggle('sel',!!sel);
    els.forEach((b,i)=>b.classList.toggle('on',all[i].c===sel));
    [...$('legend').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===sel));
    selIdx=all.map((t,i)=>i).filter(i=>all[i].c===sel).sort((a,b)=>pos[a][0]-pos[b][0]);
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.innerHTML=selIdx.length>1?'<polyline class="glow"/><polyline class="ln" pathLength="1"/>':'';
    lnEls=[...svg.children];setLines();
    $('tnote').textContent=sel?`${sel}: ${selIdx.length} tools`:IDLE;
  }
  const off=all.map(()=>[0,0]),tg=all.map(()=>[0,0]),fin=all.map(()=>[0,0]);let vis=true;
  new IntersectionObserver(e=>{vis=e[0].isIntersecting}).observe(sky);
  function setLines(){if(!lnEls.length)return;const q=selIdx.map(i=>(pos[i][0]+fin[i][0]).toFixed(1)+','+(pos[i][1]+fin[i][1]).toFixed(1)).join(' ');lnEls.forEach(e=>e.setAttribute('points',q))}
  /* every star floats on its own slow orbit, like the rings behind, and is nudged away from the pointer */
  function frame(t){
    els.forEach((b,i)=>{const o=off[i],g=tg[i];o[0]+=(g[0]-o[0])*.12;o[1]+=(g[1]-o[1])*.12;
      const A=10+(i*13)%12,w=.35+((i*7)%10)*.05,v=.3+((i*11)%10)*.05;
      const x=o[0]+Math.sin(t*w+i*1.7)*A,y=o[1]+Math.cos(t*v+i*2.3)*A*.8;
      fin[i][0]=x;fin[i][1]=y;b.style.transform='translate(-50%,-50%) translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)'});
    setLines()}
  if(!RM){
    (function loop(now){requestAnimationFrame(loop);if(vis)frame(now/1000)})(0);
    sky.addEventListener('pointermove',e=>{const r=sky.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,R=170;
      pos.forEach((q,i)=>{const dx=q[0]+fin[i][0]-px,dy=q[1]+fin[i][1]-py,d=Math.hypot(dx,dy);
        if(d<R&&d>1){const f=(1-d/R)*26;tg[i][0]=dx/d*f;tg[i][1]=dy/d*f}else{tg[i][0]=0;tg[i][1]=0}})});
    sky.addEventListener('pointerleave',()=>{tg.forEach(g=>{g[0]=0;g[1]=0})});
  }
  function place(){layout();const W=sky.clientWidth,H=sky.clientHeight;
    els.forEach((b,i)=>{b.style.left=pos[i][0]/W*100+'%';b.style.top=pos[i][1]/H*100+'%'});update()}
  const pick=c=>{sel=sel===c?null:c;update()};
  $('legend').onclick=e=>{if(e.target.dataset.c)pick(e.target.dataset.c)};
  sky.onclick=e=>{const st=e.target.closest('.star');if(st)pick(st.dataset.c);else if(sel)pick(sel)};
  let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(place,150)});
  place();
})();

/* three.js scene: a backend architecture, with requests flowing from client to gateway, Spring services, PostgreSQL and Redis */
let scene,cam,ren,dMat,mat4,mat5,mat6,mx=0,my=0,relabel=()=>{};
function initGL(){
  try{ren=new THREE.WebGLRenderer({canvas:$('bg'),alpha:true,antialias:true})}catch(e){return}
  ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.outputEncoding=THREE.sRGBEncoding;
  ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.05;
  scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(40,1,.1,100);cam.position.z=11;
  /* studio environment baked to a PMREM map, for realistic metal reflections */
  const es=new THREE.Scene(),pm=new THREE.PMREMGenerator(ren);
  es.add(new THREE.Mesh(new THREE.BoxGeometry(30,30,30),new THREE.MeshBasicMaterial({color:0x15161a,side:THREE.BackSide})));
  [[-7,6,5,8,5,6],[9,2,-6,4,8,3],[0,-7,6,10,3,1.4],[6,7,6,5,3,4]].forEach(a=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(a[3],a[4]),new THREE.MeshBasicMaterial({color:new THREE.Color().setRGB(a[5],a[5],a[5]*1.05),side:THREE.DoubleSide}));
    m.position.set(a[0],a[1],a[2]);m.lookAt(0,0,0);es.add(m)});
  scene.environment=pm.fromScene(es,.04).texture;pm.dispose();
  scene.add(new THREE.AmbientLight(0xffffff,.35));
  dMat=new THREE.MeshBasicMaterial({color:0x8fb8ff});
  mat5=new THREE.LineBasicMaterial({color:0x8fb8ff,transparent:true,opacity:.6});
  const body=new THREE.MeshStandardMaterial({color:0x2a2e36,metalness:.85,roughness:.38,envMapIntensity:1});
  const rig=new THREE.Group(),arch=new THREE.Group(),labels=[];scene.add(rig);rig.add(arch);arch.position.x=.75;
  function tag(text,x,y,z){const c=document.createElement('canvas');c.width=320;c.height=72;const tx=new THREE.CanvasTexture(c);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthWrite:false}));sp.position.set(x,y,z);sp.scale.set(2.2,.5,1);arch.add(sp);labels.push({c:c,tx:tx,text:text})}
  relabel=col=>labels.forEach(l=>{const g=l.c.getContext('2d');g.clearRect(0,0,320,72);g.font='600 30px "Instrument Sans",system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle=col;g.fillText(l.text,160,36);l.tx.needsUpdate=true});
  const add=(geo,x,y,z,label,ly)=>{const m=new THREE.Mesh(geo,body);m.position.set(x,y,z);m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),mat5));arch.add(m);if(label)tag(label,x,y+ly,z);return m};
  const led=(x,y,z,w)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,.05,.02),dMat);m.position.set(x,y,z);arch.add(m)};
  add(new THREE.BoxGeometry(1.2,.8,.1),-4.4,0,0,'Client',.85);
  add(new THREE.BoxGeometry(.5,2,.5),-2.4,0,0,'API Gateway',1.3);
  const S=[1.6,0,-1.6].map((y,i)=>{const z=[-.6,0,.6][i];add(new THREE.BoxGeometry(1.2,.9,.9),0,y,z,i===0?'Spring Boot services':null,.85);
    [-.25,0,.25].forEach(dy=>led(-.15,y+dy,z+.46,.6));return [0,y,z]});
  [.9,1.24,1.58].forEach(y=>add(new THREE.CylinderGeometry(.6,.6,.28,36),2.9,y,-.2,null,0));
  tag('PostgreSQL',2.9,2.15,-.2);
  add(new THREE.CylinderGeometry(.42,.42,.55,32),2.9,-1.2,.3,'Redis',.7);
  /* request paths, each carrying small packets */
  const P=(x,y,z)=>new THREE.Vector3(x,y,z),links=[];
  const cn=(a,b)=>{arch.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),mat5));links.push([a,b])};
  cn(P(-3.8,0,0),P(-2.65,0,0));
  S.forEach((q,i)=>{cn(P(-2.15,0,0),P(q[0]-.6,q[1],q[2]));cn(P(q[0]+.6,q[1],q[2]),P(2.3,1.2,-.2));if(i>0)cn(P(q[0]+.6,q[1],q[2]),P(2.5,-1.2,.3))});
  const sg=new THREE.SphereGeometry(.07,10,8),pk=[];
  links.forEach((l,i)=>{for(let k=0;k<2;k++){const m=new THREE.Mesh(sg,dMat);arch.add(m);pk.push({m:m,l:l,t:(k*.5+i*.13)%1,s:.004+((i*7)%5)*.0012})}});
  /* data-centre backdrop: a receding floor grid and rows of server racks that fade into the page */
  scene.fog=new THREE.Fog(0x0c0b0a,12,30);let fn=0;
  const grid=new THREE.GridHelper(70,35);mat6=new THREE.LineBasicMaterial({transparent:true,opacity:.22});grid.material=mat6;grid.position.y=-4.2;scene.add(grid);
  const bg=new THREE.Group(),leds=[];scene.add(bg);
  for(let i=0;i<14;i++){const x=-13+(i%7)*2.1,z=-7-Math.floor(i/7)*3.4,h=2.6+((i*5)%4)*.5;
    const r=new THREE.Mesh(new THREE.BoxGeometry(1,h,1),body);r.position.set(x,-4.2+h/2,z);bg.add(r);
    r.add(new THREE.LineSegments(new THREE.EdgesGeometry(r.geometry),mat5));
    for(let k=0;k<5;k++){const l=new THREE.Mesh(new THREE.BoxGeometry(.5,.06,.02),dMat);l.position.set(-.1,-h/2+.5+k*(h-.9)/4,.51);r.add(l);leds.push(l)}}
  const sa=new Float32Array(1800);for(let i=0;i<1800;i++)sa[i]=(Math.random()-.5)*34;
  const stg=new THREE.BufferGeometry();stg.setAttribute('position',new THREE.BufferAttribute(sa,3));
  mat4=new THREE.PointsMaterial({size:.04,transparent:true,opacity:.45});const stars=new THREE.Points(stg,mat4);scene.add(stars);
  let bx=2.9,by=.2;
  const resize=()=>{ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
    const m=innerWidth<700;bx=m?0:2.9;by=m?2.7:.2;rig.scale.setScalar(m?.4:.6)};
  addEventListener('resize',resize);resize();
  addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  (function loop(){requestAnimationFrame(loop);
    const t=RM?0:performance.now()/1000,H=document.documentElement.scrollHeight-innerHeight,p=H>0?scrollY/H:0;
    rig.rotation.y=t*.28+mx*.3+p*Math.PI;rig.rotation.x=.18+my*.2;rig.position.set(bx,by-p*.5,0);
    bg.position.x=-mx*.8+Math.sin(t*.1)*.3;if(!RM&&(fn++%24===0))leds.forEach(l=>{l.visible=Math.random()>.3});
    stars.rotation.y=t*.01+p*.3;
    pk.forEach(q=>{if(!RM){q.t+=q.s;if(q.t>1)q.t-=1}q.m.position.lerpVectors(q.l[0],q.l[1],q.t)});
    ren.render(scene,cam)})();
}

    ...Object.keys(THEMES).map(k=>({l:'Theme: '+k,f:()=>setTheme(k)})),
    {l:'Send a message',f:openMsg},{l:'Copy email',f:()=>$('copy').click()},
    {l:'Open resume',f:()=>open(DATA.resume,'_blank')},{l:'Open GitHub',f:()=>open(DATA.links[0][1],'_blank')},{l:'Open LinkedIn',f:()=>open(DATA.links[1][1],'_blank')}];
  let sel=0,list=cmds;
  const draw=()=>{ul.innerHTML=list.map((c,i)=>`<li role="option" aria-selected="${i===sel}" data-i="${i}">${c.l}</li>`).join('')};
  const openP=()=>{ov.hidden=false;inp.value='';list=cmds;sel=0;draw();inp.focus()};
  const closeP=()=>{ov.hidden=true};
  const run=i=>{const c=list[i];if(c){closeP();c.f()}};
  inp.oninput=()=>{const q=inp.value.toLowerCase();list=cmds.filter(c=>c.l.toLowerCase().includes(q));sel=0;draw()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,list.length-1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault()}else if(e.key==='Enter')run(sel)};
  ul.onclick=e=>{const li=e.target.closest('li');if(li)run(+li.dataset.i)};
  ov.onclick=e=>{if(e.target===ov)closeP()};
  addEventListener('keydown',e=>{if(e.key==='Escape')closeP();else if((e.key==='k'&&(e.metaKey||e.ctrlKey))||(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))){e.preventDefault();openP()}});
  $('pbtn').onclick=openP;
})();
</script>
</body>
</html>
